<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trip Planner</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --text-muted: #999;
            --text-danger: #d32f2f;
            --text-success: #388e3c;
            --text-accent: #1976d2;
            --surface-0: #f5f5f5;
            --surface-1: #fafafa;
            --surface-2: #ffffff;
            --bg-accent: #e3f2fd;
            --bg-success: #e8f5e9;
            --bg-warning: #fff3e0;
            --bg-danger: #ffebee;
            --fill-accent: #1976d2;
            --fill-danger: #d32f2f;
            --fill-success: #388e3c;
            --on-accent: #ffffff;
            --on-danger: #ffffff;
            --on-success: #ffffff;
            --border: #e0e0e0;
            --border-strong: #bdbdbd;
            --border-accent: #1976d2;
            --border-danger: #d32f2f;
            --border-success: #388e3c;
            --radius: 8px;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #e0e0e0;
                --text-secondary: #b0b0b0;
                --text-muted: #808080;
                --text-danger: #ff6b6b;
                --text-success: #66bb6a;
                --text-accent: #64b5f6;
                --surface-0: #121212;
                --surface-1: #1e1e1e;
                --surface-2: #2a2a2a;
                --bg-accent: #1e3a5f;
                --bg-success: #1b5e20;
                --bg-warning: #4d2600;
                --bg-danger: #5f1f1f;
                --fill-accent: #64b5f6;
                --fill-danger: #ff6b6b;
                --fill-success: #66bb6a;
                --on-accent: #000000;
                --on-danger: #ffffff;
                --on-success: #000000;
                --border: #333333;
                --border-strong: #555555;
            }
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: var(--surface-0);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        input, textarea, select {
            font-family: inherit;
            font-size: inherit;
        }
        
        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-2);
            color: var(--text-primary);
            box-sizing: border-box;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--fill-accent);
            background: var(--surface-2);
        }
        
        button {
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            transform: translateY(-1px);
        }
        
        button:active {
            transform: scale(0.98);
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 1.5s infinite;
            margin-right: 8px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        function AITripPlanner() {
            const [apiKey, setApiKey] = useState('');
            const [showApiInput, setShowApiInput] = useState(false);
            const [trips, setTrips] = useState([]);
            const [activeTrip, setActiveTrip] = useState(null);
            const [view, setView] = useState('dashboard');

            useEffect(() => {
                const saved = localStorage.getItem('aiTrips');
                const key = localStorage.getItem('openaiKey');
                if (saved) {
                    try {
                        setTrips(JSON.parse(saved));
                    } catch (e) {
                        console.error('Failed to load trips');
                    }
                }
                if (key) setApiKey(key);
            }, []);

            useEffect(() => {
                localStorage.setItem('aiTrips', JSON.stringify(trips));
            }, [trips]);

            const saveApiKey = (key) => {
                setApiKey(key);
                localStorage.setItem('openaiKey', key);
                setShowApiInput(false);
            };

            const generateItinerary = async (destination, startDate, endDate) => {
                if (!apiKey) {
                    alert('Please add your OpenAI API key first');
                    setShowApiInput(true);
                    return;
                }

                const days = Math.ceil((new Date(endDate) - new Date(startDate)) / (1000 * 60 * 60 * 24)) + 1;
                const prompt = `Create a detailed ${days}-day travel itinerary for ${destination} from ${startDate} to ${endDate}. 
Format as JSON with this structure:
{
  "itinerary": [
    {
      "day": 1,
      "date": "2024-01-01",
      "activities": [
        {"time": "09:00 AM", "activity": "Visit landmark"},
        {"time": "12:00 PM", "activity": "Lunch at restaurant"},
        {"time": "03:00 PM", "activity": "Explore museum"}
      ],
      "tips": "Wear comfortable shoes"
    }
  ],
  "bestRestaurants": ["Restaurant 1", "Restaurant 2"],
  "mustSee": ["Landmark 1", "Landmark 2"],
  "packingTips": ["Item 1", "Item 2"]
}`;

                try {
                    const response = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'gpt-3.5-turbo',
                            messages: [{ role: 'user', content: prompt }],
                            temperature: 0.7
                        })
                    });

                    if (!response.ok) {
                        throw new Error('API error: ' + response.statusText);
                    }

                    const data = await response.json();
                    const content = data.choices[0].message.content;
                    const jsonMatch = content.match(/\{[\s\S]*\}/);
                    const itineraryData = JSON.parse(jsonMatch[0]);

                    return itineraryData;
                } catch (error) {
                    alert('Error generating itinerary: ' + error.message);
                    return null;
                }
            };

            const createTrip = async (name, destination, startDate, endDate) => {
                if (!name.trim() || !destination.trim() || !startDate || !endDate) {
                    alert('Please fill in all fields');
                    return;
                }

                if (new Date(endDate) < new Date(startDate)) {
                    alert('End date must be after start date');
                    return;
                }

                const trip = {
                    id: Date.now(),
                    name,
                    destination,
                    startDate,
                    endDate,
                    itinerary: [],
                    restaurants: [],
                    mustSee: [],
                    packingTips: [],
                    loading: true
                };

                setTrips([...trips, trip]);
                setActiveTrip(trip);
                setView('overview');

                const itineraryData = await generateItinerary(destination, startDate, endDate);
                
                if (itineraryData) {
                    const updatedTrip = {
                        ...trip,
                        itinerary: itineraryData.itinerary || [],
                        restaurants: itineraryData.bestRestaurants || [],
                        mustSee: itineraryData.mustSee || [],
                        packingTips: itineraryData.packingTips || [],
                        loading: false
                    };
                    const updated = trips.map(t => t.id === trip.id ? updatedTrip : t);
                    setTrips(updated);
                    setActiveTrip(updatedTrip);
                } else {
                    const updated = trips.map(t => t.id === trip.id ? { ...t, loading: false } : t);
                    setTrips(updated);
                }
            };

            const deleteTrip = (id) => {
                if (window.confirm('Delete this trip?')) {
                    setTrips(trips.filter(t => t.id !== id));
                    if (activeTrip?.id === id) {
                        setActiveTrip(null);
                        setView('dashboard');
                    }
                }
            };

            if (view === 'dashboard' || !activeTrip) {
                return (
                    <div style={{ padding: '1rem', maxWidth: '600px', margin: '0 auto' }}>
                        <div style={{ marginBottom: '1.5rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div>
                                <h1 style={{ fontSize: '24px', fontWeight: '500', margin: '0 0 8px 0' }}>AI Trip Planner</h1>
                                <p style={{ fontSize: '13px', color: 'var(--text-secondary)', margin: 0 }}>Intelligent itineraries powered by AI</p>
                            </div>
                            <button 
                                onClick={() => setShowApiInput(!showApiInput)}
                                style={{ padding: '8px 12px', background: 'var(--surface-1)', border: '0.5px solid var(--border)', borderRadius: 'var(--radius)', fontSize: '12px' }}
                            >
                                🔑 API Key
                            </button>
                        </div>

                        {showApiInput && (
                            <div style={{ background: 'var(--bg-accent)', borderRadius: '12px', padding: '1rem', marginBottom: '1.5rem' }}>
                                <label style={{ fontSize: '12px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>OpenAI API Key</label>
                                <input 
                                    type="password"
                                    placeholder="sk-..."
                                    defaultValue={apiKey}
                                    onBlur={(e) => saveApiKey(e.target.value)}
                                    style={{ marginBottom: '8px' }}
                                />
                                <p style={{ fontSize: '11px', color: 'var(--text-muted)', margin: 0 }}>Get your key at <a href="https://platform.openai.com/api-keys" target="_blank" style={{ color: 'var(--text-accent)' }}>platform.openai.com</a></p>
                            </div>
                        )}

                        {trips.length === 0 ? (
                            <div style={{ background: 'var(--bg-accent)', borderRadius: '12px', padding: '2rem 1rem', textAlign: 'center', marginBottom: '1.5rem' }}>
                                <p style={{ fontSize: '14px', color: 'var(--text-accent)', marginBottom: '12px' }}>Ready for your next adventure?</p>
                                <NewTripForm onCreate={createTrip} />
                            </div>
                        ) : (
                            <div style={{ display: 'grid', gap: '12px', marginBottom: '1.5rem' }}>
                                {trips.map(trip => {
                                    const days = Math.ceil((new Date(trip.endDate) - new Date(trip.startDate)) / (1000 * 60 * 60 * 24)) + 1;
                                    return (
                                        <div 
                                            key={trip.id}
                                            onClick={() => { setActiveTrip(trip); setView('overview'); }}
                                            style={{ background: 'var(--surface-1)', borderRadius: '12px', padding: '1rem', border: '0.5px solid var(--border)', cursor: 'pointer', display: 'grid', gridTemplateColumns: '1fr auto', gap: '1rem', alignItems: 'start' }}
                                        >
                                            <div>
                                                <h3 style={{ fontSize: '15px', fontWeight: '500', margin: '0 0 4px 0' }}>{trip.name}</h3>
                                                <p style={{ fontSize: '13px', color: 'var(--text-secondary)', margin: 0 }}>{trip.destination}</p>
                                                <p style={{ fontSize: '12px', color: 'var(--text-muted)', margin: '4px 0 0 0' }}>{days} days • {trip.itinerary.length > 0 ? '✓ Itinerary ready' : 'Generating...'}</p>
                                            </div>
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); deleteTrip(trip.id); }}
                                                style={{ padding: '4px 8px', background: 'transparent', border: 'none', color: 'var(--text-secondary)', cursor: 'pointer', fontSize: '12px' }}
                                            >
                                                Delete
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {trips.length > 0 && <NewTripForm onCreate={createTrip} />}
                    </div>
                );
            }

            return (
                <div style={{ padding: '1rem', maxWidth: '600px', margin: '0 auto' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '1rem' }}>
                        <button 
                            onClick={() => { setView('dashboard'); setActiveTrip(null); }}
                            style={{ padding: '8px 12px', background: 'transparent', border: '0.5px solid var(--border)', borderRadius: 'var(--radius)', cursor: 'pointer' }}
                        >
                            ← Back
                        </button>
                        <h2 style={{ fontSize: '18px', fontWeight: '500', margin: 0, flex: 1 }}>{activeTrip.name}</h2>
                    </div>

                    {activeTrip.loading ? (
                        <div style={{ textAlign: 'center', padding: '2rem' }}>
                            <p style={{ fontSize: '14px', color: 'var(--text-secondary)' }}>
                                <span className="loading"></span>Generating your perfect itinerary...
                            </p>
                        </div>
                    ) : (
                        <div style={{ display: 'grid', gap: '1.5rem' }}>
                            <div>
                                <h3 style={{ fontSize: '14px', fontWeight: '500', marginBottom: '12px' }}>Your Itinerary</h3>
                                <div style={{ display: 'grid', gap: '12px' }}>
                                    {activeTrip.itinerary?.map((day, idx) => (
                                        <div key={idx} style={{ background: 'var(--surface-1)', borderRadius: '12px', padding: '12px', border: '0.5px solid var(--border)' }}>
                                            <h4 style={{ fontSize: '13px', fontWeight: '500', margin: '0 0 8px 0' }}>Day {day.day} - {day.date}</h4>
                                            {day.activities?.map((act, aidx) => (
                                                <div key={aidx} style={{ fontSize: '12px', marginBottom: '6px', paddingLeft: '12px', borderLeft: '2px solid var(--fill-accent)' }}>
                                                    <p style={{ fontWeight: '500', margin: '0 0 2px 0', color: 'var(--text-accent)' }}>{act.time}</p>
                                                    <p style={{ margin: 0, color: 'var(--text-primary)' }}>{act.activity}</p>
                                                </div>
                                            ))}
                                            {day.tips && <p style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '8px', fontStyle: 'italic', margin: 0 }}>💡 {day.tips}</p>}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {activeTrip.mustSee?.length > 0 && (
                                <div>
                                    <h3 style={{ fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>Must See</h3>
                                    <div style={{ display: 'grid', gap: '6px' }}>
                                        {activeTrip.mustSee.map((place, idx) => (
                                            <div key={idx} style={{ background: 'var(--bg-success)', padding: '8px 12px', borderRadius: 'var(--radius)', fontSize: '12px' }}>
                                                ⭐ {place}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTrip.restaurants?.length > 0 && (
                                <div>
                                    <h3 style={{ fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>Recommended Restaurants</h3>
                                    <div style={{ display: 'grid', gap: '6px' }}>
                                        {activeTrip.restaurants.map((rest, idx) => (
                                            <div key={idx} style={{ background: 'var(--bg-accent)', padding: '8px 12px', borderRadius: 'var(--radius)', fontSize: '12px' }}>
                                                🍽️ {rest}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTrip.packingTips?.length > 0 && (
                                <div>
                                    <h3 style={{ fontSize: '14px', fontWeight: '500', marginBottom: '8px' }}>Packing Tips</h3>
                                    <div style={{ display: 'grid', gap: '6px' }}>
                                        {activeTrip.packingTips.map((tip, idx) => (
                                            <div key={idx} style={{ background: 'var(--bg-warning)', padding: '8px 12px', borderRadius: 'var(--radius)', fontSize: '12px' }}>
                                                🎒 {tip}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function NewTripForm({ onCreate }) {
            const [name, setName] = useState('');
            const [destination, setDestination] = useState('');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [open, setOpen] = useState(false);
            const [loading, setLoading] = useState(false);

            const handleCreate = async () => {
                setLoading(true);
                await onCreate(name, destination, startDate, endDate);
                setName('');
                setDestination('');
                setStartDate('');
                setEndDate('');
                setOpen(false);
                setLoading(false);
            };

            if (!open) {
                return (
                    <button 
                        onClick={() => setOpen(true)}
                        style={{ width: '100%', padding: '12px', background: 'var(--fill-accent)', color: 'var(--on-accent)', border: 'none', borderRadius: 'var(--radius)', cursor: 'pointer', fontWeight: '500' }}
                    >
                        ✨ Create New Trip
                    </button>
                );
            }

            return (
                <div style={{ background: 'var(--surface-1)', borderRadius: '12px', padding: '1rem', border: '0.5px solid var(--border)', display: 'grid', gap: '8px' }}>
                    <input placeholder="Trip name (e.g., Summer Europe)" value={name} onChange={(e) => setName(e.target.value)} />
                    <input placeholder="Destination (e.g., Paris, France)" value={destination} onChange={(e) => setDestination(e.target.value)} />
                    <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} />
                    <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} />
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                        <button 
                            onClick={handleCreate}
                            disabled={loading}
                            style={{ padding: '8px', background: 'var(--fill-accent)', color: 'var(--on-accent)', border: 'none', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '13px', fontWeight: '500', opacity: loading ? 0.7 : 1 }}
                        >
                            {loading ? 'Generating...' : 'Create & Generate'}
                        </button>
                        <button 
                            onClick={() => setOpen(false)}
                            style={{ padding: '8px', background: 'transparent', border: '0.5px solid var(--border)', borderRadius: 'var(--radius)', cursor: 'pointer', fontSize: '13px' }}
                        >
                            Cancel
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<AITripPlanner />);
    </script>
</body>
</html>
